[project]
name = "plybench"
version = "3.0.0"
description = "PlyBench is a benchmark suite for evaluating the performance of LLMs and LLM Agents in simple game environments."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jakub Rada", email = "radajak5@fel.cvut.cz" }]
keywords = [
    "llm",
    "large-language-models",
    "ai",
    "artificial-intelligence",
    "game-theory",
    "benchmark",
    "games",
    "agents",
    "evaluation",
    "openspiel",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Games/Entertainment :: Board Games",
    "Typing :: Typed",
]
dependencies = [
    "clankers>=3.0.2",
    "numpy>=2.5.1",
    "open-spiel>=2.0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "scipy>=1.18.0",
    "tqdm>=4.69.1",
    "plyllm>=1.0.0,<2",
]

[project.optional-dependencies]
openai = ["plyllm[openai]"]
gemini = ["plyllm[gemini]"]
grok = ["plyllm[grok]"]
anthropic = ["plyllm[anthropic]"]
mistral = ["plyllm[mistral]"]
metacentrum = ["plyllm[metacentrum]"]
huggingface = ["plyllm[huggingface]"]
viz = ["matplotlib>=3.10.0"]
all = ["plyllm[all]", "matplotlib>=3.10.0"]

[project.urls]
Homepage = "https://plybench.jakubrada.com"
Repository = "https://github.com/radajakub/plybench"
Issues = "https://github.com/radajakub/plybench/issues"
Paper = "https://arxiv.org/abs/2608.03420"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plybench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = []

[tool.ruff]
line-length = 180
target-version = "py312"

[tool.ruff.lint]
# Minimal set: pyflakes (F), essential pycodestyle errors (E4/E7/E9), import sorting (I).
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "plyllm[openai,gemini,anthropic,mistral]",
    "matplotlib>=3.10.0",
    "pyright>=1.1.414",
]
